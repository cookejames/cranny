# Checks every pull request, and each merge before it deploys (deploy.yml calls this).
# specs/2026-09-26-ci-deploy/SPEC.md §3.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its previous run. Runs called from deploy.yml have no PR number, so
# they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The Ably conformance run skips itself: CI has no ABLY_KEY.
      - run: pnpm test
      - run: pnpm build
