<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessel – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=DM+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#F3EFE6;color:#1D1B18}
a{color:#1D1B18}a:hover{color:#5E574C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 28px; background: #F3EFE6; color: #1D1B18; font-family: 'Instrument Sans', system-ui, sans-serif;">

<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 60px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.95;">Tessel</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.4; color: #5E574C;">Nine pieces. Seven blocked squares. One grid to fill.</p>
</div>

<div style="align-self: center; width: 300px; height: 300px; box-sizing: border-box; padding: 8px; background: #D6CCB9; border-radius: 16px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="36">
<div style="border-radius: 6px; display: flex; align-items: center; justify-content: center; background: {{cell.bg}};">
<sc-if value="{{cell.blocked}}" hint-placeholder-val="{{false}}">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #4A453D;"></span>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto;">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 16px; background: #1D1B18; color: #F3EFE6; text-decoration: none;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 2h4"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800;">Beat the clock</span>
<span style="font-size: 14px; color: #D9CFBD;">Solo · fill the grid as fast as you can</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="Race.dc.html" style="display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 16px; border: 1.5px solid #CFC5B2; color: #1D1B18; text-decoration: none;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"></path><path d="M18.5 14.8c1.7.8 2.8 2.6 3 5.2"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="display: flex; align-items: center; gap: 8px;">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800;">Race</span>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: #E4DCCC; color: #5E574C;">Coming soon</span>
</span>
<span style="font-size: 14px; color: #5E574C;">Multiplayer · first full grid wins</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { i4: '#3F6FA8', o4: '#E3A87C', t4: '#8C5BA6', s4: '#2F8F85', l4: '#C4557A', i3: '#D1604B', v3: '#6E9E6A', d1: '#E0A43A', m1: '#7FA7C9' };
    const grid = [
      'd1 v3 v3 X o4 o4',
      'd1 v3 X t4 o4 o4',
      'm1 X l4 t4 t4 i4',
      'X X l4 t4 s4 i4',
      'X l4 l4 s4 s4 i4',
      'i3 i3 i3 s4 X i4'
    ];
    const cells = [];
    grid.forEach(row => row.split(' ').forEach(k => {
      cells.push(k === 'X' ? { bg: '#26231F', blocked: true } : { bg: colors[k], blocked: false });
    }));
    return { cells };
  }
}
</script>
</body>
</html>
